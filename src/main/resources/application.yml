server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: NexusAgent
    description: Enterprise Knowledge Assistant Backend MVP
    enterprise-readiness: header-based skeleton

spring:
  application:
    name: nexus-agent
  config:
    import: optional:file:.env[.properties]
  webflux:
    multipart:
      max-in-memory-size: ${NEXUS_MULTIPART_MAX_IN_MEMORY_SIZE:1MB}
      max-disk-usage-per-part: ${NEXUS_MULTIPART_MAX_DISK_USAGE_PER_PART:30MB}
      max-parts: ${NEXUS_MULTIPART_MAX_PARTS:4}
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:nexusagent}
    username: ${POSTGRES_USER:nexus}
    password: ${POSTGRES_PASSWORD:nexus-local-password}
  flyway:
    enabled: true
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:nexusagent}
    user: ${POSTGRES_USER:nexus}
    password: ${POSTGRES_PASSWORD:nexus-local-password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  codec:
    max-in-memory-size: 1MB

nexus:
  openai:
    api-key: ${NEXUS_LLM_API_KEY:}
    answer-model: ${NEXUS_LLM_MODEL:gpt-5.6-luna}
    embedding-timeout: ${NEXUS_OPENAI_EMBEDDING_TIMEOUT:20s}
    answer-timeout: ${NEXUS_OPENAI_ANSWER_TIMEOUT:90s}
  agent:
    enabled: ${NEXUS_AGENT_ENABLED:false}
    worker-mode: ${NEXUS_AGENT_WORKER_MODE:scripted}
    worker-token: ${NEXUS_AGENT_WORKER_TOKEN:}
    provider: ${NEXUS_LLM_PROVIDER:}
    model: ${NEXUS_LLM_MODEL:}
    lease: ${NEXUS_AGENT_LEASE:45s}
    active-timeout: ${NEXUS_AGENT_ACTIVE_TIMEOUT:180s}
    tool-timeout: ${NEXUS_AGENT_TOOL_TIMEOUT:10s}
    max-tools: ${NEXUS_AGENT_MAX_TOOLS:30}
    max-rounds: ${NEXUS_AGENT_MAX_ROUNDS:12}
    approval-ttl: ${NEXUS_AGENT_APPROVAL_TTL:30m}
    max-recoveries: ${NEXUS_AGENT_MAX_RECOVERIES:3}
    event-poll-interval: ${NEXUS_AGENT_EVENT_POLL_INTERVAL:1s}
    max-events: ${NEXUS_AGENT_MAX_EVENTS:500}
  redis:
    enabled: ${NEXUS_REDIS_ENABLED:true}
    recent-session-ttl: ${NEXUS_REDIS_RECENT_SESSION_TTL:24h}
    session-summary-ttl: ${NEXUS_REDIS_SESSION_SUMMARY_TTL:7d}
    retrieval-cache-ttl: ${NEXUS_REDIS_RETRIEVAL_CACHE_TTL:30m}
    tool-output-ttl: ${NEXUS_REDIS_TOOL_OUTPUT_TTL:2h}
    query-status-ttl: ${NEXUS_REDIS_QUERY_STATUS_TTL:30m}
    max-recent-session-events: ${NEXUS_REDIS_MAX_RECENT_SESSION_EVENTS:25}
    max-cache-entry-bytes: ${NEXUS_REDIS_MAX_CACHE_ENTRY_BYTES:131072}
    max-tool-output-bytes: ${NEXUS_REDIS_MAX_TOOL_OUTPUT_BYTES:65536}
  upload:
    max-file-size-bytes: ${NEXUS_UPLOAD_MAX_FILE_SIZE_BYTES:26214400}
  chunking:
    parent-max-chars: ${NEXUS_CHUNKING_PARENT_MAX_CHARS:1200}
    child-max-chars: ${NEXUS_CHUNKING_CHILD_MAX_CHARS:400}
    child-overlap-chars: ${NEXUS_CHUNKING_CHILD_OVERLAP_CHARS:80}
  embeddings:
    provider: ${NEXUS_EMBEDDINGS_PROVIDER:local}
    dimension: ${NEXUS_EMBEDDINGS_DIMENSION:384}
    model: ${NEXUS_EMBEDDINGS_MODEL:text-embedding-3-small}
  retrieval:
    default-top-k: ${NEXUS_RETRIEVAL_DEFAULT_TOP_K:10}
    max-top-k: ${NEXUS_RETRIEVAL_MAX_TOP_K:50}
    rrf-k: ${NEXUS_RETRIEVAL_RRF_K:60}
  context:
    default-budget-chars: ${NEXUS_CONTEXT_DEFAULT_BUDGET_CHARS:4000}
    max-budget-chars: ${NEXUS_CONTEXT_MAX_BUDGET_CHARS:12000}
  query:
    answer-provider: ${NEXUS_ANSWER_PROVIDER:local}
    live-context-timeout: ${NEXUS_LIVE_CONTEXT_TIMEOUT:45s}
    state-timeout: ${NEXUS_QUERY_STATE_TIMEOUT:2s}
    rewrite-timeout: ${NEXUS_QUERY_REWRITE_TIMEOUT:20s}
    live-cache-enabled: ${NEXUS_LIVE_CACHE_ENABLED:true}
    live-cache-ttl: ${NEXUS_LIVE_CACHE_TTL:15m}
    live-cache-timeout: ${NEXUS_LIVE_CACHE_TIMEOUT:500ms}
    live-cache-max-bytes: ${NEXUS_LIVE_CACHE_MAX_BYTES:131072}
    semantic-cache-enabled: ${NEXUS_SEMANTIC_CACHE_ENABLED:true}
    semantic-cache-min-similarity: ${NEXUS_SEMANTIC_CACHE_MIN_SIMILARITY:0.96}
    semantic-cache-max-entries: ${NEXUS_SEMANTIC_CACHE_MAX_ENTRIES:100}
    context-timeout: ${NEXUS_QUERY_CONTEXT_TIMEOUT:20s}
    answer-timeout: ${NEXUS_QUERY_ANSWER_TIMEOUT:5s}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ROOT_USER:minioadmin}
      secret-key: ${MINIO_ROOT_PASSWORD:minio-local-password}
      bucket: ${MINIO_BUCKET:nexus-documents}
      operation-timeout: ${MINIO_OPERATION_TIMEOUT:10s}
